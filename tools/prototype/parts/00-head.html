<style>

* { box-sizing: border-box; }

.wrap { max-width: 1280px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }

h1 span { color: var(--cyan); }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }

.chip:hover { color: var(--fg); }
.chip[aria-pressed="true"] { color: var(--fg); background: var(--panel-2); box-shadow: inset 0 -3px 0 var(--accent), inset 0 0 0 1px var(--line); }
.chip:focus-visible, .ctl:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.dot { width: 8px; height: 8px; background: currentColor; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }

.ctl[aria-pressed="true"] { color: var(--fg); box-shadow: inset 0 0 0 1px var(--cyan); background: var(--panel-2); }
.group-label { font: 12px var(--mono); color: var(--muted); align-self: center; margin-right: 2px; text-transform: uppercase; letter-spacing: .08em; }

.size { font: 13px var(--mono); color: var(--accent); }

<div class="wrap">
  <header>
    <h1>TC <span>Quantum</span> · modelos 3D</h1>
    <p>Arraste para girar, dois dedos ou roda do rato para aproximar. As medidas estão em pixels do Minecraft (16 px = 1 bloco), já dentro dos limites de um modelo de bloco.</p>

  <nav class="chips" id="chips" aria-label="Modelos"></nav>

      <div class="controls" id="controls"></div>
    </div>
    <aside id="info" aria-live="polite"></aside>
  </div>
</div>
