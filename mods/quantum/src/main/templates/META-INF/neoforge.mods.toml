modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Jocian Mendonca (tiny-core)"
description='''
Armazenamento e automacao sem cabos: um Nucleo Quantico, blocos entrelacados por toda a base,
numeros gigantes e o Observatorio, que mostra tudo o que a rede consegue fabricar agora.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tccore"
    type="required"
    versionRange="${tccore_version_range}"
    ordering="AFTER"
    side="BOTH"
