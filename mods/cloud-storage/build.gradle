// TC Cloud Storage. Configuração comum (NeoForge, TC Core, runs, testes) no plugin "tc.mod" (build-logic/).
plugins {
    id 'tc.mod'
}

dependencies {
    // AE2: compila contra a API publicada; opcional em jogo (integration/Ae2Compat).
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}:api"
    testImplementation "org.appliedenergistics:appliedenergistics2:${ae2_version}:api"

    // runClient/runServer com o AE2 completo (libs/ da raiz). Testar sem o AE2: -Plibs_dir=<pasta vazia>.
    localRuntime fileTree(dir: atm10Libs, include: ['appliedenergistics2-*.jar', 'guideme-*.jar'])
}
