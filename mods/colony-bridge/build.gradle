// TC Colony Bridge. Configuração comum (NeoForge, TC Core, runs, testes) no plugin "tc.mod" (build-logic/).
plugins {
    id 'tc.mod'
}

neoForge {
    runs {
        configureEach {
            // Log detalhado dos registros em dev (ajuda a achar bloco/item que não registrou).
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

dependencies {
    // AE2: compila contra a API publicada.
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}:api"
    testImplementation "org.appliedenergistics:appliedenergistics2:${ae2_version}:api"

    // MineColonies (+ Structurize, BlockUI, Domum Ornamentum) e o AE2 completo, copiados do ATM10 para libs/ na
    // raiz: compila e testa contra as mesmas versões do modpack (ver libs/LEIA-ME.md).
    compileOnly fileTree(dir: atm10Libs, include: 'minecolonies-*.jar')
    // JEI: opcional em jogo; só usado para arrastar itens para o filtro (client/jei/).
    compileOnly fileTree(dir: atm10Libs, include: 'jei-*.jar')
    localRuntime fileTree(dir: atm10Libs, include: '*.jar')
}
