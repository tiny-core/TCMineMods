pluginManagement {
    // Plugin "tc.mod" (build-logic/): a configuração que todo mod TC repete.
    includeBuild 'build-logic'
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    // Baixa sozinho o JDK 21 que os mods exigem (Windows ou Linux).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'TCMineMods'

// Cada mod é um subprojeto que mora em mods/<nome>. O nome do projeto é curto (':core', ':colony-bridge'),
// então os comandos ficam ./gradlew :colony-bridge:runClient. Mod novo: ver README.md, "Criar um mod novo".
['core', 'colony-bridge', 'cloud-storage', 'quantum'].each { name ->
    include name
    project(":$name").projectDir = file("mods/$name")
}
